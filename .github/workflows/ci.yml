name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/CODEOWNERS'
  pull_request:

  # Note: `paths-ignore` is intentionally not set on `pull_request`.
  # GitHub does not evaluate path filters on PRs from forks (it can't
  # read the diff), so docs-only PRs still get a full build to prove
  # the catalog data and any embedded code samples still compile.

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build solution (ns2.1 + net10.0 multi-target)
        run: dotnet build GasNet.sln -c Release

      - name: Run tests
        run: dotnet test GasNet.sln -c Release --no-build

      - name: Demo transcript runs end-to-end
        run: dotnet run --project src/GasNet.Demo -c Release --no-build

      # Deliberately outside the sln (same reason as locally): verifies the net8.0 consumer
      # really picks up the netstandard2.1 core build.
      - name: Godot demo builds against the core library
        run: dotnet build examples/GodotDemo -c Release

      # UseCases is a smoke test that exercises combined scenarios (tasks + tags + data + bridge).
      # stderr noise from the catalog loader is expected (tag-only GEs) — the exit code is the truth.
      - name: Build UseCases
        run: dotnet build examples/UseCases -c Release

      - name: UseCases scenarios run end-to-end
        run: dotnet run --project examples/UseCases -c Release --no-build 2>/dev/null
